[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-master-ai"
version = "0.3.0"
description = "Local-first multi-AI engine with Ollama teams, projects, tools, and creative workflows"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Mike Hyman"}]
dependencies = [
  "anyio>=4.9,<4.10",
  "fastapi>=0.115.14,<0.116",
  "httpx>=0.28.1,<0.29",
  "pydantic>=2.13.4,<2.14",
  "python-dotenv>=1.2.2,<1.3",
  "PyYAML>=6.0.3,<6.1",
  "rich>=14.3.4,<14.4",
  "starlette>=0.46.2,<0.47",
  "typer>=0.27,<0.28",
  "uvicorn>=0.51,<0.52"
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1,<9.2",
  "ruff>=0.16,<0.17"
]
packaging = [
  "pyinstaller>=6.21,<6.22"
]

[project.scripts]
master = "project_master.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
project_master = ["resources/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
